<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="128" height="192">
  <!-- Helmet -->
  <rect x="10" y="0" width="12" height="4" fill="#c0392b"/>
  <rect x="8" y="2" width="16" height="6" fill="#c0392b"/>
  <rect x="8" y="4" width="16" height="4" fill="#e74c3c"/>
  
  <!-- Visor -->
  <rect x="10" y="4" width="12" height="4" fill="#2c3e50"/>
  <rect x="12" y="5" width="8" height="2" fill="#34495e"/>
  <rect x="14" y="5" width="2" height="1" fill="#5d6d7e"/>
  
  <!-- Neck -->
  <rect x="12" y="8" width="8" height="2" fill="#c0392b"/>
  
  <!-- Body - Yellow suit -->
  <rect x="8" y="10" width="16" height="12" fill="#f39c12"/>
  <rect x="8" y="10" width="16" height="2" fill="#e67e22"/>
  
  <!-- Red cloth/scarf -->
  <rect x="10" y="10" width="12" height="3" fill="#c0392b"/>
  <rect x="8" y="12" width="4" height="4" fill="#c0392b"/>
  
  <!-- Blue vest -->
  <rect x="10" y="13" width="12" height="6" fill="#2980b9"/>
  <rect x="12" y="14" width="8" height="4" fill="#3498db"/>
  
  <!-- Arms -->
  <rect x="4" y="12" width="4" height="8" fill="#f39c12"/>
  <rect x="24" y="12" width="4" height="8" fill="#f39c12"/>
  
  <!-- Gloves -->
  <rect x="4" y="18" width="4" height="3" fill="#bdc3c7"/>
  <rect x="24" y="18" width="4" height="3" fill="#bdc3c7"/>
  
  <!-- Rifle -->
  <rect x="6" y="16" width="20" height="2" fill="#2c3e50"/>
  <rect x="22" y="14" width="6" height="2" fill="#2c3e50"/>
  <rect x="6" y="17" width="4" height="1" fill="#c0392b"/>
  <rect x="10" y="16" width="2" height="2" fill="#e74c3c"/>
  
  <!-- Legs -->
  <rect x="10" y="22" width="5" height="12" fill="#f39c12"/>
