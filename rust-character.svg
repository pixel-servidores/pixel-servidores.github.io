  <rect x="10" y="22" width="5" height="2" fill="#e67e22"/>
  <rect x="17" y="22" width="5" height="2" fill="#e67e22"/>
  
  <!-- Boots -->
  <rect x="9" y="34" width="6" height="3" fill="#7f8c8d"/>
  <rect x="17" y="34" width="6" height="3" fill="#7f8c8d"/>
  <rect x="9" y="35" width="6" height="2" fill="#95a5a6"/>
  <rect x="17" y="35" width="6" height="2" fill="#95a5a6"/>
  
  <!-- Knee pads -->
  <rect x="10" y="28" width="5" height="2" fill="#7f8c8d"/>
  <rect x="17" y="28" width="5" height="2" fill="#7f8c8d"/>
